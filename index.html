<script>
  // 禁用滑鼠右鍵
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // 禁用快捷鍵 (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S)
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
    ) {
      e.preventDefault();
      return false;
    }
  });
</script>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Hero - 英雄飛揚大冒險</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@700;900&display=swap');

    body {
      font-family: 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .pixel-font {
      font-family: 'Press Start 2P', cursive, sans-serif;
    }

    /* 光暈與特效動畫 */
    @keyframes wukongGlow {
      0%, 100% { filter: drop-shadow(0 0 10px #ff9900) drop-shadow(0 0 20px #ff3300); transform: scale(1); }
      50% { filter: drop-shadow(0 0 18px #ffcc00) drop-shadow(0 0 30px #ff6600); transform: scale(1.05); }
    }

    @keyframes magicGlow {
      0%, 100% { filter: drop-shadow(0 0 10px #ff66cc) drop-shadow(0 0 20px #ff99ff); transform: scale(1); }
      50% { filter: drop-shadow(0 0 18px #ff3399) drop-shadow(0 0 30px #ffffff); transform: scale(1.05); }
    }

    @keyframes alienGlow {
      0%, 100% { filter: drop-shadow(0 0 10px #00ffcc) drop-shadow(0 0 20px #00ff66); transform: scale(1); }
      50% { filter: drop-shadow(0 0 18px #33ffff) drop-shadow(0 0 30px #66ff33); transform: scale(1.05); }
    }

    .glow-wukong { animation: wukongGlow 1.2s infinite ease-in-out; }
    .glow-sailor { animation: magicGlow 1.2s infinite ease-in-out; }
    .glow-alien { animation: alienGlow 1.2s infinite ease-in-out; }

    /* 隱藏滾動條 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

                   class="w-full bg-slate-950 border-2 border-slate-700 rounded-xl px-4 py-3 text-center text-amber-300 font-bold focus:outline-none focus:border-amber-400 transition"

        <button onclick="restartGame()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl border border-slate-600 transition">

        </button>

    <!-- UI 層：排行榜 Modal -->

        <div class="flex justify-between items-center pb-3 border-b border-slate-800">

  <script>
    // ==========================================
    // Google Apps Script API 部署網址
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxLCuUVKY0rEfCkSMDB0Z3QfinY5Bf9dcebHwRTBgIwZXxuMNKaK_nmNEw1wBnrUHf7/exec";

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = 'MENU'; // 'MENU', 'PLAYING', 'GAMEOVER'
    let selectedChar = null;
    let score = 0;
    let frameCount = 0;
    let particles = [];
    let bgParticles = [];
    let soundEnabled = true;

    // 音效設定 (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'jump') {
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'score') {
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        }
      } catch(e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
    }

    const CHARACTERS = {
      wukong: {
        name: '孫悟空',
        glowColor: '#ff9900',
        particleColor: ['#ffcc00', '#ff6600', '#ff3300'],
        bgType: 'desert'
      },
      sailor: {
        name: '美少女戰士',
        glowColor: '#ff66cc',
        particleColor: ['#ff99ff', '#ff3399', '#ffffff'],
        bgType: 'city'
      },
      alien: {
        name: '外星人',
        glowColor: '#00ffcc',
        particleColor: ['#33ffff', '#00ff66', '#a855f7'],
        bgType: 'space'
      }
    };

    const bird = {
      x: 80,
      y: 300,
      radius: 20,
      velocity: 0,
      gravity: 0.08,
      jump: -3.2,
      rotation: 0
    };

    let pipes = [];
    const pipeConfig = {
      width: 28,
      gap: 200,
      spawnRate: 150,
      baseSpeed: 1.4
    };

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') handleJump();
    });
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handleJump();
    });

    function handleJump() {
      if (gameState === 'PLAYING') {
        bird.velocity = bird.jump;
        playSound('jump');
        for (let i = 0; i < 6; i++) {
          particles.push({
            x: bird.x - 10,
            y: bird.y + 10,
            vx: (Math.random() - 0.5) * 2 - 1.5,
            vy: Math.random() * 1.5 + 0.5,
            size: Math.random() * 5 + 3,
            color: CHARACTERS[selectedChar].particleColor[Math.floor(Math.random() * CHARACTERS[selectedChar].particleColor.length)],
            life: 1
          });
        }
      }
    }

    function selectCharacter(key) {
      selectedChar = key;
      document.getElementById('charSelectMenu').classList.add('hidden');
      document.getElementById('gameHUD').classList.remove('hidden');
      initBgParticles();
      resetGame();
      gameState = 'PLAYING';
      requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      bird.y = 300;
      bird.velocity = 0;
      bird.rotation = 0;
      pipes = [];
      particles = [];
      score = 0;
      frameCount = 0;
      document.getElementById('scoreDisplay').innerText = '0';
    }

    function updateCharCount(input) {
      document.getElementById('charCounter').innerText = `${input.value.length}/10`;
    }

    function initBgParticles() {
      bgParticles = [];
      const count = selectedChar === 'space' ? 60 : 30;
      for (let i = 0; i < count; i++) {
        bgParticles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 1,
          speed: Math.random() * 0.5 + 0.2,
          opacity: Math.random()
        });
      }
    }

    function gameLoop() {
      if (gameState !== 'PLAYING') return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();
      updateAndDrawPipes();
      updateAndDrawBird();
      updateAndDrawParticles();

      frameCount++;
      requestAnimationFrame(gameLoop);
    }

    function drawBackground() {
      const bgType = CHARACTERS[selectedChar].bgType;

      if (bgType === 'desert') {
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#7c2d12');
        grad.addColorStop(0.6, '#c2410c');
        grad.addColorStop(1, '#f59e0b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(300, 120, 40, 0, Math.PI * 2);
        ctx.fill();

      } else if (bgType === 'city') {
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#0f172a');
        grad.addColorStop(0.7, '#581c87');
        grad.addColorStop(1, '#831843');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(20, 480, 50, 200);
        ctx.fillRect(80, 420, 70, 260);
        ctx.fillRect(180, 500, 60, 180);
        ctx.fillRect(260, 450, 80, 230);

      } else if (bgType === 'space') {
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#020617');
        grad.addColorStop(0.8, '#090d16');
        grad.addColorStop(1, '#1e1b4b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.fillStyle = '#ffffff';
      bgParticles.forEach(p => {
        p.x -= p.speed;
        if (p.x < 0) p.x = canvas.width;
        ctx.globalAlpha = p.opacity;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;
    }

    // 全身像素角色繪製（前傾衝刺飛行姿態 / UFO飛船）
    function updateAndDrawBird() {
      bird.velocity += bird.gravity;
      bird.y += bird.velocity;

      // 飛行傾斜角度隨速度增加
      bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, bird.velocity * 0.1));

      if (bird.y + bird.radius >= canvas.height - 20 || bird.y - bird.radius <= 0) {
        triggerGameOver();
        return;
      }

      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      const charInfo = CHARACTERS[selectedChar];
      const glowGrad = ctx.createRadialGradient(0, 0, bird.radius * 0.5, 0, 0, bird.radius * 2);
      glowGrad.addColorStop(0, charInfo.glowColor);
      glowGrad.addColorStop(1, 'transparent');
      
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius * 2.2, 0, Math.PI * 2);
      ctx.fill();

      // 依角色繪製精細全身與飛行姿態
      if (selectedChar === 'wukong') {
        // 孫悟空：頭戴金箍、紅色披風、身體前傾衝刺
        ctx.fillStyle = '#dc2626'; ctx.fillRect(-18, -4, 16, 10);   // 身後飄揚披風
        ctx.fillStyle = '#b45309'; ctx.fillRect(-10, -6, 20, 14);  // 身體護甲
        ctx.fillStyle = '#f59e0b'; ctx.fillRect(2, -14, 16, 14);   // 頭部臉龐
        ctx.fillStyle = '#fbbf24'; ctx.fillRect(0, -18, 20, 4);    // 金箍咒
        ctx.fillStyle = '#78350f'; ctx.fillRect(10, -10, 4, 4);    // 眼睛
        ctx.fillStyle = '#ea580c'; ctx.fillRect(-12, 6, 8, 4);     // 前伸金箍棒
      } else if (selectedChar === 'sailor') {
        // 美少女戰士：金髮雙馬尾向後飄、水手服、優雅前傾
        ctx.fillStyle = '#fde047'; ctx.fillRect(-22, -12, 14, 8);  // 飄逸金色雙馬尾
        ctx.fillStyle = '#ec4899'; ctx.fillRect(-10, -4, 18, 12);  // 水手服身體
        ctx.fillStyle = '#fbcfe8'; ctx.fillRect(2, -14, 15, 14);   // 臉部
        ctx.fillStyle = '#f43f5e'; ctx.fillRect(8, -18, 6, 4);     // 頭飾水晶
        ctx.fillStyle = '#831843'; ctx.fillRect(10, -10, 4, 4);    // 眼睛
      } else if (selectedChar === 'alien') {
        // 外星人：坐在圓盤幽浮飛船 (UFO) 內
        ctx.fillStyle = '#38bdf8'; 
        ctx.beginPath(); ctx.arc(0, -6, 10, Math.PI, 0, false); ctx.fill(); // 透明玻璃罩
        ctx.fillStyle = '#06b6d4'; ctx.fillRect(-20, 2, 40, 8);   // UFO 金屬圓盤機身
        ctx.fillStyle = '#34d399'; ctx.fillRect(-2, -12, 4, 6);    // 外星人頭頂天線
        ctx.fillStyle = '#020617'; ctx.fillRect(-4, -8, 8, 6);     // 外星人大眼
        ctx.fillStyle = '#a855f7'; 
        ctx.beginPath(); ctx.ellipse(0, 10, 14, 4, 0, 0, Math.PI * 2); ctx.fill(); // 底部噴射光環
      }

      ctx.restore();
    }

    // 每 10 分加速 5% 的流暢難度成長機制
    function updateAndDrawPipes() {
      // 速度計算公式：基礎速度 * (1 + 每10分增加 5%)
      const currentSpeed = pipeConfig.baseSpeed * Math.pow(1.05, Math.floor(score / 10));

      if (frameCount % pipeConfig.spawnRate === 0) {
        const minTop = 60;
        const maxTop = canvas.height - pipeConfig.gap - 100;
        const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
        pipes.push({
          x: canvas.width,
          top: topHeight,
          passed: false
        });
      }

      pipes.forEach((pipe, index) => {
        pipe.x -= currentSpeed;

        let pipeColor = '#10b981';
        let capColor = '#059669';

        if (CHARACTERS[selectedChar].bgType === 'desert') {
          pipeColor = '#d97706'; capColor = '#b45309';
        } else if (CHARACTERS[selectedChar].bgType === 'city') {
          pipeColor = '#ec4899'; capColor = '#be185d';
        } else if (CHARACTERS[selectedChar].bgType === 'space') {
          pipeColor = '#06b6d4'; capColor = '#0891b2';
        }

        ctx.fillStyle = pipeColor;
        ctx.fillRect(pipe.x, 0, pipeConfig.width, pipe.top);
        ctx.fillStyle = capColor;
        ctx.fillRect(pipe.x - 3, pipe.top - 12, pipeConfig.width + 6, 12);

        const bottomY = pipe.top + pipeConfig.gap;
        const bottomHeight = canvas.height - bottomY;
        ctx.fillStyle = pipeColor;
        ctx.fillRect(pipe.x, bottomY, pipeConfig.width, bottomHeight);
        ctx.fillStyle = capColor;
        ctx.fillRect(pipe.x - 3, bottomY, pipeConfig.width + 6, 12);

        if (
          bird.x + bird.radius - 4 > pipe.x &&
          bird.x - bird.radius + 4 < pipe.x + pipeConfig.width &&
          (bird.y - bird.radius + 4 < pipe.top || bird.y + bird.radius - 4 > bottomY)
        ) {
          triggerGameOver();
        }

        if (!pipe.passed && pipe.x + pipeConfig.width < bird.x) {
          pipe.passed = true;
          score++;
          document.getElementById('scoreDisplay').innerText = score;
          playSound('score');
        }
      });

      pipes = pipes.filter(p => p.x + pipeConfig.width > -20);
    }

    function updateAndDrawParticles() {
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;

        if (p.life <= 0) {
          particles.splice(index, 1);
        } else {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.globalAlpha = 1.0;
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      playSound('hit');
      document.getElementById('finalScore').innerText = score;
      document.getElementById('gameOverModal').classList.remove('hidden');
    }

    function restartGame() {
      document.getElementById('gameOverModal').classList.add('hidden');
      resetGame();
      gameState = 'PLAYING';
      requestAnimationFrame(gameLoop);
    }

    function submitScore() {
      const nameInput = document.getElementById('playerNameInput');
      const name = nameInput.value.trim() || 'no name';
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.innerText = '正在連線傳送成績...';

      fetch(GAS_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, score: score })
      })
      .then(() => {
        btn.innerText = '成績登錄成功！';
        setTimeout(() => {
          document.getElementById('gameOverModal').classList.add('hidden');
          openLeaderboard();
          btn.disabled = false;
          btn.innerText = '提交成績並查看排行';
        }, 800);
      })
      .catch(err => {
        document.getElementById('gameOverModal').classList.add('hidden');
        openLeaderboard();
        btn.disabled = false;
        btn.innerText = '提交成績並查看排行';
      });
    }

    function openLeaderboard() {
      const modal = document.getElementById('leaderboardModal');
      const loading = document.getElementById('loadingLeaderboard');
      const list = document.getElementById('leaderboardList');

      modal.classList.remove('hidden');
      loading.classList.remove('hidden');
      list.classList.add('hidden');
      list.innerHTML = '';

      fetch(GAS_API_URL)
        .then(res => res.json())
        .then(data => {
          loading.classList.add('hidden');
          list.classList.remove('hidden');

          if (!data || data.length === 0) {
            list.innerHTML = '<div class="text-center text-slate-500 py-6 text-xs">目前還沒有玩家登錄紀錄</div>';
            return;
          }

          data.forEach((item, index) => {
            let rankBadge = `<span class="w-6 h-6 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-xs font-bold">${index + 1}</span>`;
            if (index === 0) rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-400 text-slate-950 flex items-center justify-center text-xs font-black">1</span>`;
            if (index === 1) rankBadge = `<span class="w-6 h-6 rounded-full bg-slate-300 text-slate-950 flex items-center justify-center text-xs font-black">2</span>`;
            if (index === 2) rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-700 text-white flex items-center justify-center text-xs font-black">3</span>`;

            const row = document.createElement('div');
            row.className = 'flex items-center justify-between p-2.5 bg-slate-950/60 rounded-xl border border-slate-800';
            row.innerHTML = `
              <div class="flex items-center gap-2.5">
                ${rankBadge}
                <span class="font-bold text-sm text-slate-200 truncate max-w-[130px]">${escapeHtml(item.name)}</span>
              </div>
              <span class="pixel-font text-amber-400 text-sm">${item.score}</span>
            `;
            list.appendChild(row);
          });
        })
        .catch(err => {
          loading.classList.add('hidden');
          list.classList.remove('hidden');
          list.innerHTML = '<div class="text-center text-red-400 py-6 text-xs">讀取排行榜失敗，請檢查網路</div>';
        });
    }

    function closeLeaderboard() {
      document.getElementById('leaderboardModal').classList.add('hidden');
      if (gameState === 'GAMEOVER') {
        document.getElementById('charSelectMenu').classList.remove('hidden');
        document.getElementById('gameHUD').classList.add('hidden');
        gameState = 'MENU';
      }
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
